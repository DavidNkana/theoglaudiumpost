schema_version: "1.0"
standard_version: 2026-05-18
environment: production
runtime:
  services:
    frontend:
      url: "https://laudiumpost.co.za/"
      container: laudium-frontend
      compose_service: frontend
      image_tag: laudium-post-frontend:latest
    backend_api:
      url: "https://laudiumpost.co.za/laudium/api/v1/"
      healthcheck_url: "https://laudiumpost.co.za/laudium/api/v1/articles/stats"
    docker_compose:
      host_path: "/opt/laudium-post"
      compose_file: "/opt/laudium-post/docker-compose.prod.yml"
      project: laudium-post
      services: [mysql, backend, frontend]
env:
  production_api_base: "https://laudiumpost.co.za/laudium/api/v1/"
  forbidden_legacy_api_base: "https://server.safai.co.za/Laudiumbiz/api/v1/"
credentials:
  test_accounts: []
seed_data:
  required: false
  reset_command: ""
user_story_tests:
  command: "Jobs final E2E/UX only after Deployment Manager deploys; not run by sysadmin readiness repair."
  notes: "Runtime config records production URLs only; no secrets stored."
