<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    APP ICON - DARK MODE
    ====================
    
    Background: #2c3e50 (dark blue-gray)
    Elements: #f5edd6 (warm cream)
    
    φ structure preserved:
    - Icon center at y = 195.584 (0.382H)
    - Icon: 160.689 × 260 (1.3× scale)
  -->
  
  <!-- Background -->
  <rect width="512" height="512" rx="89" ry="89" fill="#2c3e50"/>
  
  <!-- NEWSPAPER ICON -->
  <g transform="translate(175.656, 65.584)">
    
    <!-- Back paper layer -->
    <rect x="9.1" y="11.7" width="160.689" height="260" rx="13" ry="13" 
          fill="none" stroke="#f5edd6" stroke-width="5.85"/>
    
    <!-- Main newspaper -->
    <rect x="0" y="0" width="160.689" height="260" rx="13" ry="13" 
          fill="#2c3e50" stroke="#f5edd6" stroke-width="5.85"/>
    
    <!-- NEWS header -->
    <text x="80.345" y="31.2" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="26" 
          font-weight="700"
          fill="#f5edd6" 
          text-anchor="middle"
          letter-spacing="3.9">NEWS</text>
    
    <!-- Header divider -->
    <line x1="13" y1="41.6" x2="147.689" y2="41.6" stroke="#f5edd6" stroke-width="1.95"/>
    
    <!-- Image block -->
    <rect x="13" y="49.4" width="61.373" height="99.311" rx="3.9" ry="3.9" fill="#f5edd6"/>
    
    <!-- Text lines -->
    <line x1="82.173" y1="62.4" x2="147.689" y2="62.4" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="82.173" y1="80.6" x2="147.689" y2="80.6" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="82.173" y1="98.8" x2="147.689" y2="98.8" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="82.173" y1="117" x2="123.5" y2="117" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="82.173" y1="135.2" x2="147.689" y2="135.2" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    
    <!-- Bottom content -->
    <line x1="13" y1="169" x2="147.689" y2="169" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="13" y1="192.4" x2="147.689" y2="192.4" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="13" y1="215.8" x2="147.689" y2="215.8" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    <line x1="13" y1="239.2" x2="88.4" y2="239.2" stroke="#f5edd6" stroke-width="4.55" stroke-linecap="round"/>
    
  </g>
  
  <!-- TEXT BLOCK -->
  <g transform="translate(256, 0)">
    
    <text y="400" fill="#f5edd6" text-anchor="middle">
      <tspan font-family="Georgia, 'Times New Roman', serif" 
             font-size="32" 
             font-weight="400"
             letter-spacing="0.5">Laudium</tspan>
      <tspan dx="-2"
             font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
             font-size="32" 
             font-weight="600"
             letter-spacing="0">Biz</tspan>
    </text>
    
    <line x1="-57" y1="412" x2="57" y2="412" 
          stroke="#f5edd6" stroke-width="2.781" stroke-linecap="round"/>
    
  </g>
  
</svg>
