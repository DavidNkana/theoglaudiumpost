<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 647 400" width="647" height="400">
  <!--
    MAIN LOGO - LIGHT MODE
    ======================
    
    Background: #f5edd6 (warm cream)
    Elements: #2c3e50 (dark blue-gray)
  -->
  
  <!-- Background -->
  <rect width="647" height="400" fill="#f5edd6"/>
  
  <!-- NEWSPAPER ICON -->
  <g transform="translate(123.517, 52.786)">
    
    <rect x="7" y="9" width="123.607" height="200" rx="10" ry="10" 
          fill="none" stroke="#2c3e50" stroke-width="4.5"/>
    
    <rect x="0" y="0" width="123.607" height="200" rx="10" ry="10" 
