spring.application.name=Laudiumbiz
server.port=8080
server.servlet.context-path=/laudium

spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=update

jwt.secret-key=${JWT_SECRET_KEY:}
jwt.expiration=2592000000
jwt.refresh-expiration=5184000000

openai.api.key=${OPENAI_API_KEY:pipeline-openai-disabled}
gemini.api.key=${GEMINI_API_KEY:pipeline-gemini-disabled}
gemini.model=gemini-3.1-pro-preview
gemini.project.id=lyt-soft
gemini.location=europe-west4

xai.api.key=${XAI_API_KEY:}
xai.model=${XAI_MODEL:grok-4.3}
xai.api.url=${XAI_API_URL:https://api.x.ai/v1/chat/completions}
xai.api.url.responses=${XAI_API_URL_RESPONSES:https://api.x.ai/v1/responses}

tavily.api.key=${TAVILY_API_KEY:}
tavily.api.url=${TAVILY_API_URL:https://api.tavily.com/search}
tavily.enabled=${TAVILY_ENABLED:true}
tavily.deep-search.enabled=${TAVILY_DEEP_SEARCH_ENABLED:false}
tavily.supplement.enabled=${TAVILY_SUPPLEMENT_ENABLED:false}
tavily.fallback.min-results=${TAVILY_FALLBACK_MIN_RESULTS:2}
tavily.max-results=${TAVILY_MAX_RESULTS:8}
tavily.topic=${TAVILY_TOPIC:news}
tavily.country=${TAVILY_COUNTRY:south africa}

minimax.api.key=${MINIMAX_API_KEY:}
minimax.host=${MINIMAX_HOST:https://api.minimax.io}
minimax.model=${MINIMAX_MODEL:MiniMax-M3}
minimax.thinking=${MINIMAX_THINKING:adaptive}

openai.api.url.chat=${OPENAI_API_URL_CHAT:https://api.openai.com/v1/chat/completions}
openai.api.url.images=${OPENAI_API_URL_IMAGES:https://api.openai.com/v1/images/generations}
openai.api.url.responses=${OPENAI_API_URL_RESPONSES:https://api.openai.com/v1/responses}
openai.api.model.image=${OPENAI_API_MODEL_IMAGE:gpt-image-2}
openai.api.model.chat=${OPENAI_API_MODEL_CHAT:gpt-5.5}
onesignal.api.url=${ONESIGNAL_API_URL:https://onesignal.com/api/v1}

onesignal.app-id=${ONESIGNAL_APP_ID:}
onesignal.api-key=${ONESIGNAL_API_KEY:}

payfast.merchant.id=${PAYFAST_MERCHANT_ID:}
payfast.merchant.key=${PAYFAST_MERCHANT_KEY:}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.return-url=${PAYFAST_RETURN_URL:}
payfast.cancel-url=${PAYFAST_CANCEL_URL:}
payfast.notify-url=${PAYFAST_NOTIFY_URL:}
payfast.sandbox-url=https://sandbox.payfast.co.za/eng/process

cloudinary.cloudName=${CLOUDINARY_CLOUD_NAME:}
cloudinary.apiKey=${CLOUDINARY_API_KEY:}
cloudinary.apiSecret=${CLOUDINARY_API_SECRET:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.url=api.yml

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONN_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
spring.mail.from=${MAIL_FROM:no-reply@laudiumbiz.com}
