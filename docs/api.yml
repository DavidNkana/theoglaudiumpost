components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SourceArticle:
      type: object
      properties:
        id:
          type: integer
          description: Database ID of the persisted source article
        url:
          type: string
          description: URL of the source article
        platform:
          type: string
          description: Social media platform (e.g., facebook, twitter, instagram)
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the post
        author:
          type: string
          description: Author of the post
        content:
          type: string
          description: Content of the post
        shareCount:
          type: integer
          description: Number of shares
        commentCount:
          type: integer
          description: Number of comments
        hashtags:
          type: array
          items:
            type: string
          description: Hashtags used in the post
        additionalData:
          type: object
          additionalProperties: true
          description: Additional platform-specific data
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: Token expiration time in seconds

    ArticleRequest:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        content:
          type: string
        coverImage:
          type: string
          description: Base64 encoded image
        thumbnailImage:
          type: string
          description: Base64 encoded image
        articleType:
          type: string
          enum: [featured, popular, top]
        categoryId:
          type: integer
        status:
          type: string
          enum: [draft, published, scheduled]
        authorId:
          type: string
        archived:
          type: boolean
        scheduledFor:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: integer
        notify:
          type: boolean

    ArticleResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        content:
          type: string
        article_type:
          type: string
        author:
          type: string
        status:
          type: string
        archived:
          type: boolean
        cover:
          type: object
          properties:
            file:
              type: string
        thumbnail:
          type: object
          properties:
            file:
              type: string
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        category_id:
          type: integer
        cover_id:
          type: integer
        scheduled_for:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    ArticleQueryParams:
      type: object
      properties:
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 10
        search:
          type: string
        category:
          type: integer
        status:
          type: string
        type:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        excludeIds:
          type: array
          items:
            type: integer

    PublishRequestDTO:
      type: object
      properties:
        articleIds:
          type: array
          items:
            type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        publishAll:
          type: boolean
        publishToday:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryOrTagRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        isDeleted:
          type: boolean

    Business:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        location:
          type: string
        user_id:
          type: integer
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BusinessDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string
        location:
          type: string
        isDeleted:
          type: boolean

    Ad:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        image:
          type: string
        url:
          type: string
        campaign_id:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Campaign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        business_id:
          type: integer
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          
    Prompt:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          description: The type of prompt (e.g., "system", "user")
        name:
          type: string
          description: The name of the prompt (e.g., "DefaultArticlePrompt")
        content:
          type: string
          description: The content of the prompt
        active:
          type: boolean
          description: Whether the prompt is active
          
    PromptDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: The type of prompt (e.g., "system", "user")
        name:
          type: string
          description: The name of the prompt (e.g., "DefaultArticlePrompt")
        content:
          type: string
          description: The content of the prompt
        active:
          type: boolean
          description: Whether the prompt is active
          
    PromptRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt for text generation
      required:
        - prompt
        
    TopicRequest:
      type: object
      properties:
        topic:
          type: string
          description: The topic for research or content generation
      required:
        - topic
        
    GeneratedArticleResponse:
      type: object
      properties:
        title:
          type: string
          description: The title of the generated article
        slug:
          type: string
          description: URL-friendly version of the title
        article:
          type: string
          description: The main content of the generated article
        summary:
          type: string
          description: A concise summary of the article
      required:
        - title
        - slug
        - article
        - summary
        
    ThumbnailRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt for thumbnail generation
        model:
          type: string
          description: The model to use for image generation
        n:
          type: integer
          description: Number of images to generate
      required:
        - prompt

    ArticleGenerated:
      type: object
      properties:
        title:
          type: string
        article:
          type: string
        summary:
          type: string
        slug:
          type: string
        sources:
          type: array
          items:
            type: string
      required:
        - title
        - article
        - summary
        - slug

    SourceArticleResponse:
      type: object
      properties:
        sourceArticles:
          type: array
          items:
            $ref: '#/components/schemas/SourceArticle'
        count:
          type: integer
        taskId:
          type: integer
        prompt:
          type: string
        fieldDescriptions:
          type: object
          additionalProperties:
            type: string

    ArticleByIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
          description: The SourceArticles ID to generate from

    BulkArticleByIdsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int32
          description: List of SourceArticles IDs
        email:
          type: string
          format: email
          description: Optional email address to notify when bulk processing completes

    GenerateByIdResponse:
      type: object
      properties:
        articleId:
          type: integer
          format: int32
        slug:
          type: string
        title:
          type: string
        sourceId:
          type: integer
          format: int32
        status:
          type: string
          description: draft | published | scheduled
        coverMediaId:
          type: integer
          format: int32
          nullable: true
        coverUrl:
          type: string
          nullable: true

    BulkResultItem:
      type: object
      properties:
        sourceId:
          type: integer
          format: int32
        ok:
          type: boolean
        articleId:
          type: integer
          format: int32
          nullable: true
        slug:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        coverMediaId:
          type: integer
          format: int32
          nullable: true
        coverUrl:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    BulkGenerateResponse:
      type: object
      properties:
        totalRequested:
          type: integer
        totalSuccess:
          type: integer
        totalFailed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkResultItem'

    ProcessingAcceptedResponse:
      type: object
      properties:
        status:
          type: string
          description: processing status
        totalRequested:
          type: integer
        ids:
          type: array
          items:
            type: integer
            format: int32