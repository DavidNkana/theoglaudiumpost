# Production frontend nginx (Docker Compose on laudium-post network).
# Browser calls same-origin /api; nginx proxies to the laudium-backend container.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~ \.wasm$ { default_type application/wasm; }

  # Service-worker entry points must be revalidated on every deployment.
  # Hashed assets remain cacheable, while admin navigations are served by the
  # network because Workbox excludes /admin from its navigation fallback.
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /laudium/api/$1 break;
    proxy_pass http://laudium-backend:9011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backward-compatible passthrough for clients still controlled by a
  # previously installed PWA service worker. New builds use /api/, but this
  # prevents cached releases from receiving the SPA's 405 response at login.
  location /laudium/api/ {
    proxy_pass http://laudium-backend:9011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
