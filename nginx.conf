# Frontend test server for k3s PR environments (Vue SPA / Flutter web).
#
# The browser only ever talks to THIS host, so it's same-origin: no CORS, no
# per-PR backend URL injected into the app — the app just calls relative `/api`.
# nginx reverse-proxies `/api` to this PR's backend service inside the cluster.
#
# `__PROJECT__` and `__PR_ID__` are substituted at image-build time (see the
# Dockerfiles). PROJECT must be the SANITIZED project name (lowercase, only
# [a-z0-9-]) — the same sanitization the controller uses for namespaces.
#
# proxy_pass uses a variable so nginx starts even when the backend Service does
# not exist yet (frontend-only PR smoke); DNS resolves at request time.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

  # Flutter CanvasKit ships .wasm — make sure it's served as application/wasm.
  location ~ \.wasm$ { default_type application/wasm; }

  # Same-origin API: proxy /api/* to this PR's backend (in-cluster service).
  # Trailing slash strips the /api prefix: /api/users -> backend /users.
  location /api/ {
    set $backend_upstream app.ncvte-__PROJECT__-backend-pr__PR_ID__.svc.cluster.local;
    rewrite ^/api/(.*)$ /laudium/api/$1 break;
    proxy_pass http://$backend_upstream:80;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: client-side routes (Vue Router history mode / Flutter routing)
  # must return index.html, not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}