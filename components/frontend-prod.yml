name: Laudium-post-frontend-prod
trigger:
  branches:
    include: [main]
  paths:
    include: [src/, scripts/, frontend-route-coverage.yaml, api.yaml, components/, nginx.prod.conf, Dockerfile.vue]
pool:
  vmImage: 'ubuntu-latest'
variables:
  - group: Laudium-post-prod-vg
  - name: COMPONENT
    value: frontend
stages:
  - stage: wait_for_test_pipeline
    displayName: 'Wait for frontend-test Succeeded on this SHA'
    jobs:
      - job: check
        steps:
          - checkout: none
          - task: Bash@3
            displayName: 'Query Azure DevOps for prior frontend-test run on this SHA'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                SHA="$(Build.SourceVersion)"
                PIPELINE_NAME="Laudium-post-frontend-test"
                API_BASE="$(System.CollectionUri)$(System.TeamProject)/_apis"
                DEF_ID=$(curl -fsS -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                  "${API_BASE}/build/definitions?name=${PIPELINE_NAME}&api-version=7.1" \
                  | jq -r '.value[0].id // empty')
                if [ -z "$DEF_ID" ]; then
                  echo "##vso[task.logissue type=error]Pipeline definition ${PIPELINE_NAME} not found"
                  exit 1
                fi
                COUNT=$(curl -fsS -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                  "${API_BASE}/build/builds?definitions=${DEF_ID}&sourceVersion=${SHA}&resultFilter=succeeded&statusFilter=completed&$$top=1&api-version=7.1" \
                  | jq -r '.count // (.value | length)')
                if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
                  echo "##vso[task.logissue type=error]No Succeeded run of ${PIPELINE_NAME} on ${SHA}. Prod deploy blocked."
                  exit 1
                fi
                echo "Found ${COUNT} succeeded ${PIPELINE_NAME} build(s) on ${SHA}"
  - stage: build
    displayName: 'Build frontend prod image (push to ACR)'
    dependsOn: wait_for_test_pipeline
    jobs:
      - job: build
        steps:
          - task: Bash@3
            displayName: 'Docker build and push frontend prod image to ACR'
            env:
              ACR_PASSWORD: $(ACR_PASSWORD)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                docker run --privileged --rm tonistiigi/binfmt --install arm64
                IMAGE="$(ACR_REGISTRY)/laudium-post-frontend:$(Build.SourceVersion)"
                LATEST="$(ACR_REGISTRY)/laudium-post-frontend:latest"
                echo "$ACR_PASSWORD" | docker login "$(ACR_REGISTRY)" -u "$(ACR_USERNAME)" --password-stdin
                docker build --platform linux/arm64 -f Dockerfile.vue \
                  --build-arg NGINX_CONF=nginx.prod.conf \
                  -t "$IMAGE" -t "$LATEST" .
                docker push "$IMAGE"
                docker push "$LATEST"
  - stage: deploy_to_prod
    displayName: 'Deploy to prod (SSH remote Docker Compose)'
    dependsOn: [build, wait_for_test_pipeline]
    jobs:
      - deployment: prod_deploy
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: SSH@0
                  displayName: 'Deploy frontend image on prod (compose up frontend)'
                  inputs:
                    sshEndpoint: 'prod-ssh-Laudium-post'
                    failOnStdErr: false
                    runOptions: 'inline'
                    inline: |
                      set -euo pipefail
                      IMAGE="$(ACR_REGISTRY)/laudium-post-frontend:$(Build.SourceVersion)"
                      echo '$(ACR_PASSWORD)' | docker login '$(ACR_REGISTRY)' -u '$(ACR_USERNAME)' --password-stdin
                      docker pull "$IMAGE"
                      docker tag "$IMAGE" laudium-post-frontend:latest
                      cd /opt/laudium-post
                      docker compose -p laudium-post -f docker-compose.prod.yml up -d --no-deps --no-build frontend
                - task: Bash@3
                  displayName: 'Health check $(PROD_PUBLIC_URL)/healthz'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      for i in $(seq 1 30); do
                        if curl -fsS "$(PROD_PUBLIC_URL)/healthz" >/dev/null; then exit 0; fi
                        sleep 5
                      done
                      echo "Prod health check failed"; exit 1
                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'
                - task: Bash@3
                  displayName: 'Install pipeline script dependencies'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      npm ci --prefix scripts
                      npx --prefix scripts playwright install --with-deps chromium
                - task: Bash@3
                  displayName: 'Run D18 smoke test against prod'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      node scripts/d18-smoke-test.mjs --base-url "$(PROD_PUBLIC_URL)" --endpoints frontend-routes.json
                - task: Bash@3
                  displayName: "Run api-coverage-check.mjs (prod) against backend's deployed api.yaml"
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      node scripts/api-coverage-check.mjs api.yaml frontend-api-test-fixtures.yaml "$(PROD_PUBLIC_URL)" $(Build.ArtifactStagingDirectory)/prod-api-coverage.json
                      COVERAGE=$(jq -r .coverage $(Build.ArtifactStagingDirectory)/prod-api-coverage.json)
                      if [ "$COVERAGE" != "100" ]; then
                        echo "##vso[task.logissue type=error]prod api coverage: $COVERAGE% (need 100%)"
                        exit 1
                      fi
                - task: Bash@3
                  displayName: 'Run frontend-route-coverage.mjs (prod)'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      node scripts/frontend-route-coverage.mjs src/router/index.js frontend-route-coverage.yaml "$(PROD_PUBLIC_URL)" $(Build.ArtifactStagingDirectory)/frontend-coverage.json
                      COVERAGE=$(jq -r .coverage $(Build.ArtifactStagingDirectory)/frontend-coverage.json)
                      if [ "$COVERAGE" != "100" ]; then
                        echo "##vso[task.logissue type=error]prod frontend URL coverage: $COVERAGE% (need 100%)"
                        exit 1
                      fi
                - task: PublishPipelineArtifact@1
                  displayName: 'Publish prod coverage artifacts'
                  inputs:
                    targetPath: $(Build.ArtifactStagingDirectory)
                    artifact: prod-coverage
  - stage: report
    displayName: 'Post coverage + COMPONENT-VERIFIED'
    dependsOn: deploy_to_prod
    condition: always()
    jobs:
      - job: report
        steps:
          - download: current
            artifact: prod-coverage
            condition: succeededOrFailed()
          - task: Bash@3
            displayName: 'Publish COMPONENT-VERIFIED evidence'
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                coverage_api=$(jq -r .coverage $(Pipeline.Workspace)/prod-coverage/prod-api-coverage.json 2>/dev/null || echo 0)
                coverage_fe=$(jq -r .coverage $(Pipeline.Workspace)/prod-coverage/frontend-coverage.json 2>/dev/null || echo 0)
                cat <<EOF > $(Build.ArtifactStagingDirectory)/component-verified.md
                COMPONENT-VERIFIED: Laudium-post-$(COMPONENT)-prod
                result: Succeeded
                coverage:
                  api: ${coverage_api}
                  frontendUrl: ${coverage_fe}
                EOF
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/component-verified.md
              artifact: component-verified